<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EPUB Reader</title>
<meta name="theme-color" content="#17181a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EPUB Reader">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<style>
:root{color-scheme:light;--bg:#fff;--fg:#1d1d1f;--mut:#6b6b70;--side:#f4f4f6;--acc:#0a6ed1;--accbg:#e3eefb;--line:#d9d9de;--mark:#ffe58a;--shadow:rgba(0,0,0,.18)}
:root.dark{color-scheme:dark;--bg:#17181a;--fg:#dcdcdf;--mut:#9a9aa0;--side:#1f2124;--acc:#6cb2f5;--accbg:#1d3550;--line:#34363a;--mark:#6b5a10;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#top{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--side);border-bottom:1px solid var(--line);z-index:20}
#top button{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
#top button:hover:not(:disabled){border-color:var(--acc)}
#top button:disabled{opacity:.4;cursor:default}
#ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14px}
#q{width:190px;min-width:0;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:13px}
#side{position:fixed;top:44px;bottom:0;left:0;width:330px;overflow:auto;overscroll-behavior:contain;background:var(--side);border-right:1px solid var(--line);padding:8px 0;font-size:14px;z-index:15}
#side .toc,#side .hit{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;cursor:pointer;line-height:1.35}
#side .toc{padding:5px 14px}
#side .toc.sub{font-size:13px;color:var(--mut)}
#side .hit{padding:7px 14px;border-bottom:1px solid var(--line);font-size:13px}
#side .hit small{color:var(--mut);display:block;margin-top:3px}
#side .toc:hover,#side .hit:hover{background:var(--line)}
#side .toc.cur,#side .hit.cur{color:var(--acc);background:var(--accbg);border-left-color:var(--acc);font-weight:600}
#side .info{padding:8px 14px;color:var(--mut);font-size:13px}
main{margin-left:330px;padding:64px 24px 80px}
body.noside #side{display:none}body.noside main{margin-left:0}
#page{max-width:760px;margin:0 auto;font:var(--fs,18px)/1.65 Georgia,"Times New Roman",serif;overflow-wrap:break-word}
#page h1,#page h2,#page h3,#page h4,#page h5{font-family:system-ui,sans-serif;line-height:1.25}
#page img,#page svg{max-width:100%;height:auto}
:root.dark #page img{background:#fff;border-radius:2px}
:root.dark #content [style]{color:inherit!important;background-color:transparent!important}
#page a{color:var(--acc)}
#page pre,#page code{font:.82em/1.45 Consolas,"Courier New",monospace}
#page pre{background:var(--side);border:1px solid var(--line);padding:10px;overflow:auto;border-radius:6px;white-space:pre-wrap}
#page table{border-collapse:collapse;max-width:100%;display:block;overflow:auto}
#page td,#page th{border:1px solid var(--line);padding:4px 8px;font-size:.85em}
#page blockquote{border-left:3px solid var(--line);margin-left:0;padding-left:14px;color:var(--mut)}
mark{background:var(--mark);color:inherit;border-radius:2px}
mark.hit-cur{outline:2px solid var(--acc)}
#nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:32px 0 0;padding-top:16px;border-top:1px solid var(--line);font:14px system-ui,sans-serif}
#nav button{background:var(--side);border:1px solid var(--line);border-radius:6px;padding:6px 16px;cursor:pointer}
#nav button:hover:not(:disabled){border-color:var(--acc)}
#nav button:disabled{opacity:.4;cursor:default}
#pos{color:var(--mut);font-size:13px}
#welcome{max-width:560px;margin:12vh auto;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:40px 20px;color:var(--mut)}
#welcome b{color:var(--fg);font-size:20px}
body.drag #welcome{border-color:var(--acc)}
body.drag::after{content:"Drop the EPUB file to open it";position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,110,209,.12);border:3px dashed var(--acc);color:var(--acc);font-size:22px;font-weight:600;pointer-events:none;z-index:30}
#status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--side);border:1px solid var(--line);border-radius:6px;padding:5px 14px;font-size:13px;display:none;z-index:25;box-shadow:0 2px 8px var(--shadow);max-width:90vw}
@media(max-width:900px){
  main{margin-left:0}
  #side{width:min(330px,86vw);box-shadow:4px 0 18px var(--shadow)}
}
@media(max-width:600px){
  #top{gap:4px;padding:0 6px}#top button{padding:4px 7px}
  #ttl{display:none}#q{flex:1;width:auto}
  main{padding:56px 14px 60px}
}

/* Mobile-first touch targets, safe areas, and native file picker */
#bo{position:relative;display:inline-flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;white-space:nowrap;min-height:36px;overflow:hidden}
#bo:hover{border-color:var(--acc)}
#bo:focus-within{outline:2px solid var(--acc);outline-offset:2px}
#file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
#page[hidden],#welcome[hidden]{display:none!important}
#page{min-width:0} #content{min-width:0;overflow-wrap:anywhere}
#content img,#content svg,#content video,#content canvas{max-width:100%!important;height:auto!important}
#content pre{max-width:100%;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere}
#content table{width:max-content;max-width:100%;overflow-x:auto}
#content td,#content th{overflow-wrap:normal}
#top{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
#nav button{min-height:44px}
@media(max-width:700px){
  #top{height:auto;min-height:52px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:5px;padding:5px max(8px,env(safe-area-inset-right)) 5px max(8px,env(safe-area-inset-left));}
  #bs{grid-column:1;grid-row:1} #bo{grid-column:2;grid-row:1;justify-self:start}
  #bm{grid-column:3;grid-row:1} #bp{grid-column:4;grid-row:1} #bd{grid-column:5;grid-row:1}
  #q{grid-column:1/-1;grid-row:2;width:100%;min-height:40px;font-size:16px}
  #ttl{display:none}
  #top button,#bo{min-height:40px;padding:6px 9px;font-size:13px}
  html{scroll-padding-top:110px}
  #side{top:96px;width:min(350px,90vw);padding-bottom:env(safe-area-inset-bottom)}
  #side .toc,#side .hit{min-height:44px;padding-top:10px;padding-bottom:10px}
  main{margin-left:0;padding:112px max(14px,env(safe-area-inset-right)) calc(65px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
  #page{font-size:var(--fs,18px);line-height:1.6}
  #welcome{margin:5vh auto;padding:26px 16px}
  #nav{gap:5px} #nav button{padding:8px 10px} #pos{white-space:nowrap}
}
@media(max-width:360px){
  #top{gap:3px} #top button,#bo{font-size:12px;padding:6px}
  #nav button{font-size:12px;padding:7px}
}
</style></head><body class="noside">
<div id="top">
  <button id="bs" type="button" disabled aria-controls="side" aria-expanded="false" title="Show or hide the contents">Contents</button>
  <label id="bo" for="file" role="button" tabindex="0" title="Choose an EPUB file">Open EPUB<input id="file" type="file" accept=".epub,application/epub+zip" aria-label="Choose an EPUB file"></label>
  <div id="ttl">EPUB Reader</div>
  <input id="q" type="search" placeholder="Search book, Enter" aria-label="Search the book" disabled>
  <button id="bm" type="button" title="Smaller text" aria-label="Smaller text">A-</button>
  <button id="bp" type="button" title="Larger text" aria-label="Larger text">A+</button>
  <button id="bd" type="button" title="Switch light / dark">Dark</button>
</div>
<nav id="side" aria-label="Contents"></nav>
<main>
  <div id="welcome"><b>Open an EPUB file</b><p>Click "Open EPUB" above or drop a .epub file here.<br>The book is read inside this page; nothing is uploaded or installed.</p><p><small>Keys: &larr; / &rarr; previous / next chapter, Esc clears the search.</small></p></div>
  <div id="page" hidden>
    <div id="content"></div>
    <div id="nav"><button id="prev" type="button">&larr; Previous</button><span id="pos"></span><button id="next" type="button">Next &rarr;</button></div>
  </div>
</main>
<div id="status" role="status" aria-live="polite"></div>
<script>
(function () {
"use strict";
var R = document.documentElement, $ = function (id) { return document.getElementById(id); };

  R.classList.toggle("dark", d); $("bd").textContent = d ? "Light" : "Dark";

$("bd").onclick = function () { P.dark = !R.classList.contains("dark"); applyDark(); saveP(); };
$("bm").onclick = function () { P.fs = Math.max(12, (P.fs || 18) - 1); fsApply(); saveP(); };
$("bp").onclick = function () { P.fs = Math.min(34, (P.fs || 18) + 1); fsApply(); saveP(); };
$("bs").onclick = function () { setSide(document.body.classList.contains("noside")); };
$("bo").addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });

var statusT;
function status(msg, ms) {
  var s = $("status"); s.textContent = msg; s.style.display = msg ? "block" : "none";

/* ---------- ZIP (central directory + DecompressionStream) ---------- */

/* ---------- EPUB structure ---------- */

}

    var path = resolve(opfPath, it.getAttribute("href"));

    if (nv) [].forEach.call(nv.getElementsByTagName("a"), function (a) {
      var h = a.getAttribute("href"); if (!h) return;
      var d = 0, el = a.parentNode; while (el && el !== nv) { if (el.localName === "ol" || el.localName === "ul") d++; el = el.parentNode; }
      var sp = splitHref(h); toc.push({ title: a.textContent.replace(/\s+/g, " ").trim(), depth: Math.max(d - 1, 0), path: sp[0] ? resolve(nav.path, sp[0]) : nav.path, frag: sp[1] });
    });

/* ---------- rendering ---------- */

/* Scroll to the target and mark the TOC; pick = TOC entry the user clicked (kept until the user scrolls). */

}
/* Current TOC entry: the clicked one; else, within the current chapter, the last entry whose anchor
   has scrolled past the top; else the nearest entry of an earlier chapter. */
function markToc() {
  var s = $("side"), items = s.querySelectorAll(".toc");
  if (!B || !items.length) return;
  var toc = B.toc, best = -1, k, t;
  if (B.pick != null && toc[B.pick] && toc[B.pick].idx === B.cur) best = B.pick;
  else for (k = 0; k < toc.length; k++) {
    t = toc[k];
    if (t.idx === B.cur) {
      if (best < 0 || toc[best].idx !== B.cur) best = k;
      else if (t.frag) { var el = findId($("content"), t.frag); if (el && el.getBoundingClientRect().top <= 90) best = k; }
    } else if (t.idx < B.cur && (best < 0 || (toc[best].idx !== B.cur && t.idx >= toc[best].idx))) best = k;
  }
  items.forEach(function (a, n) {
    var on = n === best; a.classList.toggle("cur", on);
    if (on) a.setAttribute("aria-current", "location"); else a.removeAttribute("aria-current");
  });
  var a = items[best];
  if (a && !document.body.classList.contains("noside") && (a.offsetTop < s.scrollTop || a.offsetTop + a.offsetHeight > s.scrollTop + s.clientHeight))
    s.scrollTop = a.offsetTop - s.clientHeight / 3;
}
function saveState() { try { localStorage.setItem(B.key, JSON.stringify({ i: B.cur, y: Math.round(window.scrollY) })); } catch (e) {} }
var sy; window.addEventListener("scroll", function () {
  if (!B || B.cur < 0) return; clearTimeout(sy);
  sy = setTimeout(function () {
    saveState();
    if (Date.now() - B.navT > 700) { B.pick = null; markToc(); }
  }, 150);
}, { passive: true });

function showToc() {
  var s = $("side"); s.replaceChildren();
  B.toc.forEach(function (t, k) {
    var a = document.createElement("button"); a.type = "button";
    a.className = "toc" + (t.depth ? " sub" : ""); a.textContent = t.title || "(untitled)"; a.title = t.title;
    a.style.paddingLeft = (14 + Math.min(t.depth, 4) * 14) + "px"; a.dataset.i = t.idx;
    a.addEventListener("click", function () { if (narrow()) setSide(false); goTo(t.idx, t.frag, null, { pick: k }); });
    s.appendChild(a);
  });
}

/* ---------- search ---------- */
function buildText() {
  if (!B.textP) {
    var book = B;
    book.textP = (async function () {
      var out = [];
      for (var i = 0; i < book.spine.length; i++) {
        if (book !== B) { book.textP = null; return null; }
        if (i % 10 === 0) status("Indexing book for search: " + i + " / " + book.spine.length);
        var d = parseDoc(await book.zip.text(book.spine[i])), b = d.getElementsByTagName("body")[0] || d.documentElement;
        [].slice.call(b.querySelectorAll("script,style")).forEach(function (n) { n.remove(); });
        out.push((b.textContent || "").replace(/\s+/g, " "));
      }
      status(""); return out;
    })();
  }
  return B.textP;
}
async function doSearch(term) {
  var s = $("side"); setSide(true);
  var text = await buildText(); if (!text) return;
  s.replaceChildren(); var lc = term.toLowerCase(), hits = 0, MAX = 300;
  for (var i = 0; i < text.length && hits < MAX; i++) {
    var src = text[i], low = src.toLowerCase(), nth = -1, next = 0;
    for (var p = low.indexOf(lc); p >= 0 && hits < MAX; p = low.indexOf(lc, p + lc.length)) {
      nth++; if (p < next) continue; next = p + lc.length + 200;
      var d = document.createElement("button"); d.type = "button"; d.className = "hit";
      var a0 = Math.max(0, p - 60), mk = document.createElement("mark"); mk.textContent = src.substr(p, term.length);
      d.append((a0 ? "…" : "") + src.slice(a0, p), mk, src.slice(p + term.length, p + term.length + 80) + "…");
      var sm = document.createElement("small"); sm.textContent = chapterName(i); d.appendChild(sm);
      (function (i, nth, d) {
        d.addEventListener("click", function () {
          [].forEach.call(s.querySelectorAll(".hit.cur"), function (x) { x.classList.remove("cur"); });
          d.classList.add("cur"); if (narrow()) setSide(false); goTo(i, "", term, { nth: nth });
        });
      })(i, nth, d);
      s.appendChild(d); hits++;
    }
  }
  var h = document.createElement("div"); h.className = "info";
  h.textContent = hits ? hits + " result(s)" + (hits >= MAX ? " (first " + MAX + ")" : "") + " – Esc or clear the box to show the contents" : "No results for “" + term + "”";
  s.insertBefore(h, s.firstChild); s.scrollTop = 0;
}
function chapterName(i) {
  var name = "Part " + (i + 1), best = -1;
  B.toc.forEach(function (t) { if (t.idx <= i && t.idx > best) { best = t.idx; name = t.title; } }); return name;
}
function backToToc() { if (B) { showToc(); markToc(); } }
$("q").addEventListener("keydown", function (e) {
  if (e.key === "Escape") { this.value = ""; backToToc(); return; }
  if (e.key !== "Enter") return;
  var v = this.value.trim(); if (v) doSearch(v); else backToToc();
});
$("q").addEventListener("input", function () { if (!this.value) backToToc(); });

/* ---------- opening ---------- */
async function openFile(file) {
  try {
    status("Opening " + file.name + " ...");
    var book = await loadBook(file);
    B = book; clearImgs(); loadToken++;
    $("welcome").hidden = true; $("page").hidden = false;
    $("ttl").textContent = book.title + (book.author ? " – " + book.author : "");
    $("ttl").title = $("ttl").textContent;
    document.title = book.title;
    $("bs").disabled = false; $("q").disabled = false; $("q").value = "";
    showToc(); setSide(!narrow());
    var st = {}; try { st = JSON.parse(localStorage.getItem(book.key) || "{}"); } catch (e) {}
    var start = new URLSearchParams(location.search).get("ch");
    await goTo(start != null ? +start : (st.i || 0));
    if (start == null && st.y) { window.scrollTo(0, st.y); B.pick = null; markToc(); }
    status(""); document.body.setAttribute("data-ready", "1");
    var sq = new URLSearchParams(location.search).get("q");
    if (sq) { $("q").value = sq; await doSearch(sq); document.body.setAttribute("data-searched", "1"); }
  } catch (err) {
    status("Cannot open this file: " + err.message + (String(err.message).includes("deflate-raw") ? " (This browser does not support EPUB decompression.)" : "")); document.body.setAttribute("data-error", err.message);
  }
}
$("file").addEventListener("change", function () {
  var inp = this, f = inp.files[0]; if (!f) return;
  openFile(f).then(function () { inp.value = ""; });
});
var dragN = 0;
function dragOff() { dragN = 0; document.body.classList.remove("drag"); }
document.addEventListener("dragenter", function (e) { e.preventDefault(); dragN++; document.body.classList.add("drag"); });
document.addEventListener("dragover", function (e) { e.preventDefault(); });
document.addEventListener("dragleave", function () { if (--dragN <= 0) dragOff(); });
document.addEventListener("drop", function (e) { e.preventDefault(); dragOff(); var f = e.dataTransfer.files[0]; if (f) openFile(f); });
$("prev").onclick = function () { goTo(B.cur - 1); }; $("next").onclick = function () { goTo(B.cur + 1); };
document.addEventListener("keydown", function (e) {
  var ae = document.activeElement;
  if (!B || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey || (ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable))) return;
  if (e.key === "ArrowRight") goTo(B.cur + 1); else if (e.key === "ArrowLeft") goTo(B.cur - 1);
  else if (e.key === "Escape" && narrow()) setSide(false);
});
var u = new URLSearchParams(location.search).get("url");
if (u) fetch(u).then(function (r) { return r.blob(); }).then(function (b) { openFile(new File([b], u.split("/").pop(), { type: "application/epub+zip" })); });
})();
</script><script>

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function(err) {

    });
  });
}
</script>
